[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-rendezvous"
dynamic = ["version"]
description = "Store-and-forward dead drop for HiveMind nodes, served over the HiveMind protocol"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "hivemind-bus-client",
    "json-database>=0.10.2a1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]


[tool.setuptools.dynamic]
version = { attr = "hivemind_rendezvous.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["hivemind_rendezvous*"]
