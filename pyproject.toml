[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-rendezvous"
version = "0.1.0"
description = "Async store-and-forward dead-drop rendezvous service for HiveMind nodes"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "hivemind-bus-client",
    "json-database>=0.10.2a1",
    "poorman-handshake",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
hivemind-rendezvous = "hivemind_rendezvous.server:run_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["hivemind_rendezvous*"]
